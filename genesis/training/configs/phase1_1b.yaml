# Phase 1: 1B Parameter Proof of Concept
# Training: NTP bootstrap on quality-filtered web data

model:
  vocab_size: 100287
  max_seq_len: 4096

  tier1:
    layers: 8
    d_model: 768
    heads: 8
    d_ff: 3072

  tier2:
    layers: 16
    d_model: 1024
    heads: 16
    d_ff: 4096
    latent_vectors_per_chunk: 4
    chunk_size: 32

  tier3:
    layers: 8
    d_model: 512
    heads: 8
    d_ff: 2048
    recurrence_steps: 4

  gate:
    type: mlp
    tier2_threshold: 0.3
    tier3_threshold: 0.7

  dropout: 0.0
  use_flash_attention: true
  rope_base: 10000.0

optimizer:
  type: muon_adamw_hybrid
  muon_lr: 0.02
  adamw_lr: 3e-4
  muon_momentum: 0.95
  adamw_betas: [0.9, 0.999]
  weight_decay: 0.01
  ns_iterations: 5

scheduler:
  type: wsd
  warmup_steps: 2000
  stable_steps: 45000
  decay_steps: 3000
  peak_lr: 0.02
  min_lr: 2e-5

training:
  phase: bootstrap
  batch_size: 32
  gradient_accumulation_steps: 4
  effective_batch_size: 128
  max_steps: 50000
  gradient_clip: 1.0
  checkpoint_interval: 1000
  eval_interval: 500
  log_interval: 10

data:
  dataset: fineweb-edu
  quality_threshold: 0.7
  max_seq_len: 4096
  num_workers: 4

hardware:
  device: cuda
  num_gpus: 1
  precision: bf16
