[project]
name = "genesis-llm"
version = "0.1.0"
description = "GENESIS: Frontier LLM with Hierarchical Latent Reasoning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "tqdm",
    "rich",
]

[project.optional-dependencies]
cuda = [
    "triton>=3.0.0",
    "flash-attn>=2.6.0",
    "bitsandbytes>=0.44.0",
    "hivemind>=1.2.0",
]
mlx = [
    "mlx>=0.20.0",
    "mlx-lm>=0.20.0",
]
data = [
    "datasets>=3.0.0",
    "tokenizers>=0.20.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
]
training = [
    "einops>=0.8.0",
    "safetensors>=0.4.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "wandb>=0.18.0",
]
vision = [
    "torchvision>=0.19.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["olympus*", "genesis*", "genesis_mlx*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: marks tests as requiring GPU",
    "slow: marks tests as slow (>10s)",
]
