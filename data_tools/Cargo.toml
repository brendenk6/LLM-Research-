[package]
name = "genesis-pack"
version = "0.1.0"
edition = "2021"

[dependencies]
tiktoken-rs = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
